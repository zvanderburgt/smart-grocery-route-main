<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Breadcrumb</title>
    <meta
      name="description"
      content="The grocery list that remembers the way"
    />
    <meta
      name="theme-color"
      content="#4ca567"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#1f2e23"
      media="(prefers-color-scheme: dark)"
    />
    <link rel="manifest" href="/manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <script>
      // iOS decides standalone status-bar text colour from this meta alone, and
      // "black-translucent" forces WHITE text. That is only legible over the
      // dark theme: on the light one the clock would be white on near-white.
      // Swap it with the system theme (best effort - iOS reads it at launch).
      (function () {
        var meta = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
        var query = window.matchMedia('(prefers-color-scheme: dark)');
        var apply = function () {
          if (meta) meta.setAttribute('content', query.matches ? 'black-translucent' : 'default');
        };
        apply();
        query.addEventListener('change', apply);
      })();
    </script>
    <meta name="apple-mobile-web-app-title" content="Breadcrumb" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap"
      as="style"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link href="/src/main.css" rel="stylesheet" />
    <!-- Google Identity Services for OAuth -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
