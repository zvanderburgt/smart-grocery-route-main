# Netlify reads this file before the site's UI settings, and only the keys it
# defines here take precedence - build command and publish directory stay
# whatever the site is configured with, so this cannot change how the app is
# built, only which runtime builds it.
#
# Why the Node pin: Vite 7 requires `^20.19.0 || >=22.12.0` and package.json had
# no `engines` field, so a build image defaulting to Node 18 (or an older 20.x)
# fails during install with an unsupported-engine error. Netlify honours
# NODE_VERSION, .nvmrc and `engines`; this is the most explicit of the three.
[build.environment]
  NODE_VERSION = "22"
