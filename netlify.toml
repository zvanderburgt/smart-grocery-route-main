# Netlify deploy config for the Vite PWA.
#
# The build keys are load-bearing. Without them the site published the raw
# repository: prod served index.html pointing at /src/main.tsx (200,
# application/octet-stream) while /assets/* and /manifest.json 404'd, so the app
# never booted. `publish = "dist"` is the actual fix; the command makes the
# build explicit rather than depending on whatever the site UI happened to hold.
[build]
  command = "npm run build"
  publish = "dist"

# Vite 7 requires `^20.19.0 || >=22.12.0` and nothing declared it, so a build
# image defaulting to Node 18 (or an older 20.x) fails during install with an
# unsupported-engine error. Netlify honours NODE_VERSION, .nvmrc and `engines`;
# this is the most explicit of the three, and package.json records the same floor.
[build.environment]
  NODE_VERSION = "22"

# The OpenCode OCR relay lives in netlify/functions/opencode-ocr.mts and routes
# itself with `export const config = { path: "/api/opencode/*" }`. Do not add a
# redirect here: a 200 rewrite cannot forward the rest of the path, so every
# request would arrive as /models and POSTs would 404.
